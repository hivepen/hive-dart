name: hive_dart
description: Pure-Dart client for the Hive blockchain — JSON-RPC reads, offline transaction building/signing (custom_json, comment, comment_options), and HiveAuth / Hive Keychain auth helpers. No Flutter dependency.
version: 0.2.0
repository: https://github.com/hivepen/hive-dart
issue_tracker: https://github.com/hivepen/hive-dart/issues

environment:
  sdk: ^3.5.0

dependencies:
  http: ^1.2.0
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
